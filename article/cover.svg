  <rect x="0" y="586" width="1200" height="1"  fill="#1e293b"/>

  <text x="86"   y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#5eead4" text-anchor="middle">38</text>
