  <rect x="670" y="144" width="240" height="20" fill="#dc2626"/>
  <text x="790" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Emergency: 108   Helpline: 104</text>

  <!-- Nav tabs -->
  <rect x="670" y="164" width="240" height="26" fill="#0a1628"/>
  <text x="722" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#14b8a6" text-anchor="middle">Chat</text>
  <rect x="703" y="188" width="38" height="2" fill="#14b8a6"/>
  <text x="769" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Rx</text>
  <text x="820" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Facilities</text>
  <text x="875" y="181" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Tips</text>

  <!-- User message 1 -->
  <rect x="756" y="202" width="144" height="32" rx="10" fill="#0f766e"/>
  <text x="828" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">My prescription says</text>
  <text x="828" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Metformin 500 mg</text>

  <!-- Bot reply 1 -->
  <rect x="678" y="244" width="186" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="692" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#e2e8f0">Your doctor prescribed this</text>
  <text x="692" y="275" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#e2e8f0">medicine for you. Each dose</text>
  <text x="692" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#e2e8f0">and timing is on the label.</text>
  <text x="692" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fcd34d">Verify with your pharmacist.</text>
  <rect x="692" y="311" width="64" height="12" rx="4" fill="#0f766e" fill-opacity="0.4"/>
  <text x="724" y="321" font-family="monospace" font-size="7" fill="#5eead4" text-anchor="middle">G-RX-VERIFY</text>

  <!-- User message 2 — emergency -->
  <rect x="756" y="336" width="144" height="22" rx="10" fill="#7f1d1d"/>
  <text x="828" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">I have severe chest pain</text>

  <!-- Bot reply 2 — emergency -->
  <rect x="678" y="368" width="222" height="64" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="692" y="385" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#f87171">EMERGENCY</text>
  <text x="692" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fca5a5">Call 108 (ambulance) NOW.</text>
  <text x="692" y="414" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#fca5a5">Go to the nearest hospital.</text>
  <text x="692" y="428" font-family="monospace" font-size="7" fill="#64748b">emergency_handoff · &lt;10ms · no model</text>

  <!-- User message 3 — Tamil -->
  <rect x="756" y="444" width="144" height="22" rx="10" fill="#0f766e"/>
  <text x="828" y="459" font-family="'Noto Sans Tamil', 'Arial Unicode MS', sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">நீரிழிவை தடுப்பது எப்படி?</text>

  <!-- Bot reply 3 — Tamil -->
  <rect x="678" y="476" width="222" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="692" y="494" font-family="'Noto Sans Tamil', 'Arial Unicode MS', sans-serif" font-size="8.5" fill="#e2e8f0">சர்க்கரை குறைவாக சாப்பிடுங்கள்.</text>
  <text x="692" y="510" font-family="'Noto Sans Tamil', 'Arial Unicode MS', sans-serif" font-size="8.5" fill="#e2e8f0">தினமும் உடற்பயிற்சி செய்யுங்கள்.</text>

  <!-- Input bar -->
  <rect x="670" y="536" width="240" height="30" fill="#0a1628"/>
  <rect x="678" y="541" width="184" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="692" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" fill="#475569">Ask in Tamil or English…</text>
  <rect x="870" y="541" width="30" height="20" rx="10" fill="#0f766e"/>
  <text x="885" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">›</text>

