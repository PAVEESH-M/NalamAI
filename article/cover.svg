<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3d38"/>
      <stop offset="100%" stop-color="#0f1f4a"/>
    </linearGradient>
    <linearGradient id="cardTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="shSm">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1140" cy="80" r="280" fill="none" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.07"/>
  <circle cx="1140" cy="80" r="360" fill="none" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.04"/>

  <!-- ═══════════════════════════════════ -->
  <!-- LEFT HALF                          -->
  <!-- ═══════════════════════════════════ -->

  <!-- Logo / icon -->
  <circle cx="72" cy="72" r="40" fill="#14b8a6" fill-opacity="0.20"/>
  <circle cx="72" cy="72" r="30" fill="#14b8a6" fill-opacity="0.30"/>
  <path d="M57 72 h6 l4-10 5 20 4-10 h7" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- App name -->
  <text x="124" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">NALAM AI</text>
  <text x="125" y="92" font-family="'Noto Sans Tamil', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="600" fill="#5eead4">நலம் AI</text>

  <!-- Divider -->
  <rect x="72" y="122" width="440" height="2" rx="1" fill="#14b8a6" fill-opacity="0.35"/>

  <!-- Tagline -->
  <text x="72" y="156" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#94a3b8">Bilingual health information for underserved communities</text>
  <text x="72" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#94a3b8">in Tamil Nadu — Tamil and English</text>

  <!-- Feature cards row 1 -->
  <!-- Card 1: Emergency Gate -->
  <rect x="72"  y="210" width="244" height="88" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="72"  y="210" width="5"   height="88" rx="3"  fill="#ef4444"/>
  <text x="92"  y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f87171">EMERGENCY GATE</text>
  <text x="92"  y="258" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">Routes to 108 in under 10 ms.</text>
  <text x="92"  y="277" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">No AI writes the response.</text>

  <!-- Card 2: Bilingual -->
  <rect x="332" y="210" width="244" height="88" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="332" y="210" width="5"   height="88" rx="3"  fill="#14b8a6"/>
  <text x="352" y="236" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#5eead4">TAMIL + ENGLISH</text>
  <text x="352" y="258" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">Auto-detected language.</text>
  <text x="352" y="277" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">Plain-language answers.</text>

  <!-- Feature cards row 2 -->
  <!-- Card 3: Prescription OCR -->
  <rect x="72"  y="314" width="244" height="88" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="72"  y="314" width="5"   height="88" rx="3"  fill="#818cf8"/>
  <text x="92"  y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">PRESCRIPTION OCR</text>
  <text x="92"  y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">Photo to plain language.</text>
  <text x="92"  y="381" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">Verify with pharmacist.</text>

  <!-- Card 4: Critic Graph -->
  <rect x="332" y="314" width="244" height="88" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shSm)"/>
  <rect x="332" y="314" width="5"   height="88" rx="3"  fill="#f59e0b"/>
  <text x="352" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">CRITIC GRAPH</text>
  <text x="352" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">Planner drafts, critic reviews.</text>
  <text x="352" y="381" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#cbd5e1">No diagnosis. No prescribing.</text>

  <!-- SDK label -->
  <text x="72" y="432" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#475569" letter-spacing="2">BUILT WITH STRANDS AGENTS SDK  ·  AMAZON BEDROCK</text>

  <!-- Block badges -->
  <rect x="72"  y="444" width="72" height="24" rx="6" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="108" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5eead4" text-anchor="middle">hooks</text>

  <rect x="154" y="444" width="72" height="24" rx="6" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="190" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5eead4" text-anchor="middle">graph</text>

  <rect x="236" y="444" width="96" height="24" rx="6" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="284" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5eead4" text-anchor="middle">struct output</text>

  <rect x="342" y="444" width="72" height="24" rx="6" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="378" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#5eead4" text-anchor="middle">tools</text>

  <rect x="424" y="444" width="84" height="24" rx="6" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
  <text x="466" y="460" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">Bedrock</text>

  <!-- Helpline strip -->
  <rect x="72" y="490" width="504" height="70" rx="12" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5"/>

  <text x="114" y="521" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="900" fill="#f87171" text-anchor="middle">108</text>
  <text x="114" y="543" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Ambulance</text>

  <rect x="152" y="502" width="1" height="46" fill="#334155"/>

  <text x="196" y="521" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="900" fill="#fcd34d" text-anchor="middle">104</text>
  <text x="196" y="543" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Health Helpline</text>

  <rect x="242" y="502" width="1" height="46" fill="#334155"/>

  <text x="342" y="521" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#86efac" text-anchor="middle">9152987821</text>
  <text x="342" y="543" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">iCall Mental Health</text>

  <rect x="450" y="502" width="1" height="46" fill="#334155"/>

  <text x="530" y="521" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc" text-anchor="middle">1800-116-117</text>
  <text x="530" y="543" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Poison Control</text>

  <!-- ═══════════════════════════════════ -->
  <!-- RIGHT HALF — Phone mockup          -->
  <!-- ═══════════════════════════════════ -->

  <rect x="660" y="60"  width="260" height="500" rx="30" fill="#0f172a" stroke="#1e293b" stroke-width="2.5" filter="url(#sh)"/>
  <rect x="670" y="78"  width="240" height="466" rx="22" fill="#0d1b2a"/>
  <rect x="740" y="78"  width="100" height="18"  rx="9"  fill="#0f172a"/>
  <circle cx="790" cy="87" r="4" fill="#1e293b"/>

  <!-- App header -->
  <rect x="670" y="96" width="240" height="48" fill="#0f766e"/>
  <text x="690" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NALAM AI</text>
  <text x="690" y="133" font-family="'Segoe UI', Arial, sans-serif" font-size="9"  fill="#ccfbf1">Tamil and English Health Assistant</text>
  <rect x="868" y="108" width="34" height="20" rx="5" fill="rgba(255,255,255,0.15)"/>
  <rect x="868" y="108" width="17" height="20" rx="5" fill="#ffffff"/>
  <text x="876" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#0f766e">EN</text>
  <text x="893" y="122" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)">த</text>

