  <rect x="171"  y="596" width="1" height="24" fill="#1e293b"/>

  <text x="257"  y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#f87171" text-anchor="middle">11</text>
  <text x="257"  y="624" font-family="'Segoe UI',Arial,sans-serif" font-size="9"  fill="#475569"    text-anchor="middle">emergency types</text>
  <rect x="343"  y="596" width="1" height="24" fill="#1e293b"/>

  <text x="428"  y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#5eead4" text-anchor="middle">&lt;10ms</text>
  <text x="428"  y="624" font-family="'Segoe UI',Arial,sans-serif" font-size="9"  fill="#475569"    text-anchor="middle">emergency gate</text>
  <rect x="514"  y="596" width="1" height="24" fill="#1e293b"/>

  <text x="600"  y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#5eead4" text-anchor="middle">83</text>
  <text x="600"  y="624" font-family="'Segoe UI',Arial,sans-serif" font-size="9"  fill="#475569"    text-anchor="middle">unit tests pass</text>
  <rect x="686"  y="596" width="1" height="24" fill="#1e293b"/>

  <text x="771"  y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#a5b4fc" text-anchor="middle">0</text>
  <text x="771"  y="624" font-family="'Segoe UI',Arial,sans-serif" font-size="9"  fill="#475569"    text-anchor="middle">unsafe responses</text>
  <rect x="857"  y="596" width="1" height="24" fill="#1e293b"/>

  <text x="942"  y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#5eead4" text-anchor="middle">22</text>
  <text x="942"  y="624" font-family="'Segoe UI',Arial,sans-serif" font-size="9"  fill="#475569"    text-anchor="middle">guidance items</text>
  <rect x="1028" y="596" width="1" height="24" fill="#1e293b"/>

  <text x="1114" y="610" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="#fcd34d" text-anchor="middle">2</text>
  <text x="1114" y="624" font-family="'Segoe UI',Arial,sans-serif" font-size="9"  fill="#475569"    text-anchor="middle">languages</text>
